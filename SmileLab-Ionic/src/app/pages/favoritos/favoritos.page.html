<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Productos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Productos</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list>
    <ion-item
      lines="none"
      class="producto-item"
      *ngFor="let producto of productos"
    >
      <ion-img
        slot="start"
        [src]="producto.imagen"
        [alt]="producto.nombre"
        class="producto-img"
        (click)="verDetalle(producto)"
      ></ion-img>

      <ion-label (click)="verDetalle(producto)">
        <h2>{{ producto.nombre }}</h2>
        <p>{{ producto.descripcion }}</p>
        <p *ngIf="producto.precio">{{ producto.precio }} €</p>
      </ion-label>

      <ion-buttons slot="end">
        <ion-button (click)="toggleFavorito(producto, $event)">
          <ion-icon
            slot="icon-only"
            [name]="esFavorito(producto.id) ? 'heart' : 'heart-outline'"
            [color]="esFavorito(producto.id) ? 'danger' : 'medium'"
          ></ion-icon>
        </ion-button>
        <ion-badge
          color="warning"
          *ngIf="esFavorito(producto.id)"
        >
          Fav
        </ion-badge>
      </ion-buttons>
    </ion-item>
  </ion-list>

</ion-content>
