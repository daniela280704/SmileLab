<!-- Vista HTML del Maestro de Favoritos (Catálogo de productos). -->
<!-- Listado dinámico de productos desde Firestore y sus respectivos botones de favorito (SQLite). -->
<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      <div class="title-container">
        <img src="assets/img/logo2.jpeg" class="header-logo" alt="Logo SmileLab" />
        <span>Productos</span>
      </div>
    </ion-title>
    <ion-buttons slot="end" class="user-header-actions">
      <div class="user-info" *ngIf="nombreUsuario">
        <ion-icon name="person-circle-outline"></ion-icon>
        <span class="user-name">Hola, {{ nombreUsuario }}</span>
      </div>
      <ion-button (click)="cerrarSesion()" class="logout-btn" fill="clear" color="danger">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="favoritos-container">

  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Productos</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list>
    <ion-item
      lines="none"
      class="producto-item"
      *ngFor="let producto of productos"
    >
      <ion-img
        slot="start"
        [src]="producto.imagen"
        [alt]="producto.nombre"
        class="producto-img"
        (click)="verDetalle(producto)"
      ></ion-img>

      <ion-label (click)="verDetalle(producto)">
        <h2>{{ producto.nombre }}</h2>
        <p class="producto-desc">{{ producto.descripcion }}</p>
        <p *ngIf="producto.precio" class="precio-texto">{{ producto.precio }}</p>
      </ion-label>

      <ion-buttons slot="end">
        <ion-button (click)="toggleFavorito(producto, $event)">
          <ion-icon
            slot="icon-only"
            [name]="esFavorito(producto.id) ? 'heart' : 'heart-outline'"
            [color]="esFavorito(producto.id) ? 'danger' : 'medium'"
          ></ion-icon>
        </ion-button>

      </ion-buttons>
    </ion-item>
  </ion-list>

  </div>
</ion-content>
