<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/favoritos" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Detalle del producto</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="detalle-content">

  <!-- Skeleton mientras carga -->
  <div *ngIf="cargando" class="skeleton-wrapper">
    <ion-skeleton-text [animated]="true" class="skeleton-img"></ion-skeleton-text>
    <div class="skeleton-info">
      <ion-skeleton-text [animated]="true" style="width: 70%; height: 26px; border-radius: 8px;"></ion-skeleton-text>
      <ion-skeleton-text [animated]="true" style="width: 35%; height: 20px; border-radius: 8px;"></ion-skeleton-text>
      <ion-skeleton-text [animated]="true" style="width: 100%; height: 14px; border-radius: 6px;"></ion-skeleton-text>
      <ion-skeleton-text [animated]="true" style="width: 90%; height: 14px; border-radius: 6px;"></ion-skeleton-text>
      <ion-skeleton-text [animated]="true" style="width: 80%; height: 14px; border-radius: 6px;"></ion-skeleton-text>
    </div>
  </div>

  <!-- Contenido real del producto -->
  <div *ngIf="!cargando && producto" class="detalle-wrapper">

    <div class="hero-img-container">
      <img [src]="producto.imagen" [alt]="producto.nombre" class="hero-img" />
    </div>

    <div class="info-card">
      <div class="info-header">
        <h1 class="producto-nombre">{{ producto.nombre }}</h1>
        <span class="precio-badge">{{ producto.precio }} €</span>
      </div>
      <p class="producto-descripcion">{{ producto.descripcion }}</p>
    </div>

  </div>

  <!-- Producto no encontrado -->
  <div *ngIf="!cargando && !producto" class="not-found">
    <div class="not-found-icon">🦷</div>
    <h2>Producto no encontrado</h2>
    <p>El producto que buscas no está disponible.</p>
  </div>

</ion-content>
